<mat-toolbar class="dialog-title" color="primary">
  <div>Grid settings</div>
  <button mat-icon-button (click)="onNoClick()">
    <fa-icon icon="times"></fa-icon>
  </button>
</mat-toolbar>
<div mat-dialog-content>
  <p>Select settings</p>
  <div>
    <mat-radio-group [(ngModel)]="data.agGridSizeControl.selectedType" class='radio-group'>
      @for (item of radioSizeType; track item) {
        <mat-radio-button [value]='item.type'>{{item.title}}</mat-radio-button>
      }
    </mat-radio-group>
  </div>

  <hr />

  @if (hasColumns) {
    <app-drag-drop-list
      [list]="allColumnIds"
      (order)="onUpdateProto($event)"
    ></app-drag-drop-list>
  }
  @if (!hasColumns) {
    <div>
      Please make a search to access settings
    </div>
  }
</div>

<div mat-dialog-actions style="float: right; margin-bottom: 0rem;">
  <!-- <button  mat-raised-button (click)="onNoClick()">{{'LINK.buttons.cancel' | translate}}</button> -->
  <button mat-raised-button color=primary [mat-dialog-close]="data" cdkFocusInitial [disabled]="!hasColumns">{{'LINK.buttons.save' | translate}}</button>
</div>
