<div class="setting-button-container">
  @if (isAccess?.add) {
    <button mat-button class="setting-btn" (click)="addDialog.emit()">
      <fa-icon icon="plus-circle"></fa-icon>
      Add
    </button>
  }
  @if (isAccess?.import) {
    <button mat-button class="setting-btn" (click)="importDialog.emit()">
      <fa-icon icon="upload"></fa-icon>
      Import
    </button>
  }
  @if (isAccess?.export) {
    <button mat-button class="setting-btn" (click)="exportDialog.emit()">
      <fa-icon icon="download"></fa-icon>
      Export
    </button>
  }
</div>
