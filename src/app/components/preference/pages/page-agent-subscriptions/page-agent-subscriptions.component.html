<app-setting-button [isAccess]='isAccess' (addDialog)='settingDialog()'></app-setting-button>
<div class="tab-name">
  <h3>{{page | titlecase}}</h3>
</div>

@if (isLoading) {
  <app-loading-circle></app-loading-circle>
}
<div #content [hidden]='isLoading'>
  <!-- if ERROR -->
  @if (isErrorResponse) {
    <div class="alert-error alert-danger">
      <mat-icon>warning</mat-icon>
      {{'notifications.error.invalidJSON' | translate}}
    </div>
  }
  <mat-form-field appearance="fill">
    <input matInput placeholder="Filter"
      [(ngModel)]="filter" (ngModelChange)='applyFilter()'
      autocomplete="off"
      />
  </mat-form-field>
  <table mat-table [dataSource]='dataSource'  mat-table [dataSource]="dataSource"
    class="mat-elevation-z8" matSort>
    @for (column of columns; track column) {
      <!-- Generic column -->
      @if (!specialColumns.includes(column)) {
        <app-generic-cell [column]='column'>
        </app-generic-cell>
      }
      @if (column === 'Expire') {
        <app-expire-cell
          [column]="column"
          [timeFormat]="dateFormat"
          [page]="page"
          [isAccess]="isAccess"
          >
        </app-expire-cell>
      }
      <!-- Button column -->
      @if (column === 'tools') {
        <app-tool-cell [column]='column' [page]='page' [isAccess]='isAccess' (settingDialog)='settingDialog($event.item, $event.type)' (deleteDialog)='deleteDialog($event)'>
        </app-tool-cell>
      }
    }
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns;"></tr>
  </table>
  <mat-paginator style="flex: 0; min-width: 500px;" [pageSizeOptions]="[25, 50, 100, 200]"
    showFirstLastButtons>
  </mat-paginator>
</div>
